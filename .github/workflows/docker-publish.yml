name: Docker Build & Push AppServer Worker to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push AppServer Worker Image on Local Infrastructure
    runs-on: self-hosted # 🔑 Utiliza o seu Runner Local para ter acesso ao disco

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 📦 Busca o arquivo binário localmente sem poluir o repositório Git
      - name: Resgatar Instaladores Proprietários no Workspace
        run: |
          cp ../../appserver.tar.gz . 2>/dev/null || cp "${{ github.workspace }}/../appserver.tar.gz" . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-appserver/appserver.tar.gz .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/appserver-dev-worker:24.3.1.5 # 🏷️ Nova nomenclatura padronizada