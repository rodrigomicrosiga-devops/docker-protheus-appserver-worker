name: CD - Build & Push AppServer Worker

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar o build manualmente pelo painel do GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐋 Configurar Docker Buildx (Mecanismo de Cache)
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ⚡ Build and Push (appserver-dev-worker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            rodrigomicrosiga/appserver-dev-worker:24.3.1.5
          cache-from: type=gha # Utiliza o cache nativo do GitHub Actions
          cache-to: type=gha,mode=max